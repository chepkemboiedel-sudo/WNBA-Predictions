# Render Blueprint for the WNBA prediction lab service.
# In the Render dashboard: New + -> Blueprint -> connect this repo -> Apply.
# Render reads this file, builds with the slim server requirements, and runs
# server.py. $PORT is injected automatically and server.py honours it.
services:
  - type: web
    name: wnba-prediction-service
    runtime: python
    plan: free
    branch: deploy-vercel-static-site
    buildCommand: pip install -r requirements-server.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW_SEC
        value: "60"
      - key: PRICE_PER_1K_TOKENS_USD
        value: "0.002"
      - key: LLM_MODEL
        value: "claude-opus-5-5"
      - key: LLM_PRICE_INPUT_PER_1K
        value: "0.004"
      - key: LLM_PRICE_OUTPUT_PER_1K
        value: "0.020"
      # ANTHROPIC_API_KEY is a SECRET -- do NOT put it here. Add it in the Render
      # dashboard (service -> Environment -> Add, sync: false). Without it,
      # /api/explain degrades gracefully and the rest of the app is unaffected.
      - key: ANTHROPIC_API_KEY
        sync: false
      # FORCE_FAIL is intentionally left unset (defaults to off). Set it to "1"
      # temporarily in the Render dashboard to demo graceful degradation.
