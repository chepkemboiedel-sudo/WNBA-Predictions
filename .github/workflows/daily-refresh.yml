name: Daily WNBA refresh

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-refresh.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'run_all.py'
      - 'requirements.txt'
      - 'refresh_schedule.json'
      - 'vercel.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wnba-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      statuses: read
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node for browser refresh checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check forecasting and daily scheduling
        run: |
          python -m unittest discover -s tests -v
          node tests/test_refresh_polling.cjs
          node tests/test_health_state.cjs

      - name: Run refresh pipeline
        if: github.event_name != 'pull_request'
        run: python run_all.py

      - name: Verify generated website and forecast
        if: github.event_name != 'pull_request'
        run: python scripts/verify_forecast.py

      - name: Commit refreshed outputs
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REFRESH_OWNER: ${{ github.repository_owner }}
          REFRESH_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$REFRESH_OWNER (forecast automation)"
          git config user.email "$REFRESH_OWNER_ID+$REFRESH_OWNER@users.noreply.github.com"
          git add data outputs public site SUMMARY.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh WNBA forecast artifacts [automated]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel published the refreshed forecast
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          DEPLOY_COMMIT: ${{ steps.publish.outputs.sha }}
        run: python scripts/wait_for_deployment.py

  report_failure:
    needs: refresh
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the last published forecast
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Record failure without replacing predictions
        run: python scripts/record_refresh_failure.py
      - name: Publish refresh health notice
        env:
          REFRESH_OWNER: ${{ github.repository_owner }}
          REFRESH_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$REFRESH_OWNER (forecast automation)"
          git config user.email "$REFRESH_OWNER_ID+$REFRESH_OWNER@users.noreply.github.com"
          git add public/refresh_health.json site/refresh_health.json
          if ! git diff --cached --quiet; then
            git commit -m "Report failed WNBA refresh [automated]"
            git push origin HEAD:main
          fi
